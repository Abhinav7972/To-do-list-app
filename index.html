<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>To-do List</title>
</head>
<body>
    <header>
        <h1>To do List App</h1>
    </header>

    <main>
     <div id="title">
        <h2>Enter your Task :</h2>
     </div>

     <div id="task">
       
        <div id="task-input">
          <input type="text" name="task" id="task_input">
          <button id="add_task_button">Add Task</button>
        </div>

        <ul id="task-list">
          <!--Tasks will be added here by js-->
        </ul>
     </div>
    </main>

    <footer>
        &copy; 2026 To-do List all rights reserved
    </footer>

    <script src="script.js"></script>
</body>
</html>
